<div class="container-100vh-flex">
   <div class="content">
      <div class="auth-header">
         <h1 class="text-lg"> Bem-vindo! </h1>
         <h2 class="text-2xl"> Crie uma nova conta ou faça login </h2>
      </div>

      <div class="auth-body">
         @switch (step) {
            @case (0) {
               <p class="text-base">Digite seu e-mail ou nome de usuário</p>

               <form [formGroup]="validationForm">
                  <div class="input-field-column">
                     <label for="username_email_input">*E-mail</label>
                     <input type="text" id="username_email_input" placeholder="usuario@email.com" formControlName="EMAIL_USERNAME">
                  </div>

                  <button type="submit" (click)="validateEmail()"> CONTINUAR </button>
               </form>
            }
            @case (1) {
               <p class="text-base">Usuário encontrado! Informe sua senha</p>

               <form [formGroup]="loginForm">
                  <div class="input-field-column">
                     <label for="username_email_input">*E-mail</label>
                     <input type="text" id="username_email_input" placeholder="usuario@email.com" formControlName="EMAIL_USERNAME">
                  </div>

                  <div class="input-field-column">
                     <label for="password_input">*Senha</label>
                     <input #passwordLogin type="password" id="password_input" formControlName="SENHA" placeholder="********">
                  </div>

                  <button type="submit" (click)="validateLogin()"> CONTINUAR </button>
               </form>
            }
            @case (2) {

            }
            @case (3) {

            }
         }
      </div>
   </div>

   <app-footer></app-footer>
</div>
