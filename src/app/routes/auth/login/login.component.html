<div class="d-flex items-center justify-center h-100">
   <div id="login-image-left" class="col-span-7 h-100 py-6 ps-3">
      <div class="h-100 background-image">
         <div class="h-100 w-100 inner-content">
            <span>Sua aventura começa aqui.</span>
         </div>
      </div>
   </div>

   <div class="col-span-5 p-20 h-100 d-flex flex-col justify-center items-center">
      <div class="content d-flex flex-col justify-between h-100">
         <div id="auth-header" class="text-center d-flex flex-row items-center justify-center gap-2 mt-20">
            <img src="../../../../assets/icons/Logo=White.png" alt="logo" height="32px">
            <h2 class="mb-0">Ready, Dice, Roll!</h2>
         </div>

         <div id="auth-body" style="min-width: 450px;">
            <div class="form-fields">
               @switch (step) {
                  @case (1) {
                     <form [formGroup]="loginForm" class="w-100 mb-12" data-bs-theme="dark">
                        <div class="row mb-6">
                           <div class="col">
                              <label for="loginEmailInput" class="form-label">E-mail</label>
                              <input type="email" id="loginEmailInput" class="form-control rounded-3" formControlName="EMAIL"
                                 placeholder="Digite seu e-mail"
                                 [class.invalid]="EMAIL_LOGIN.invalid && (EMAIL_LOGIN.touched || EMAIL_LOGIN.dirty)">
                           </div>
                        </div>

                        <div class="row mb-6">
                           <div class="col">
                              <label for="loginPasswordInput" class="form-label">Senha</label>
                              <input type="password" id="loginPasswordInput" class="form-control mb-1 rounded-3" formControlName="SENHA"
                                 placeholder="Digite sua senha"
                                 [class.invalid]="SENHA_LOGIN.invalid && (SENHA_LOGIN.touched || SENHA_LOGIN.dirty)">

                              <a type="button" class="fw-bold cursor-pointer text-decoration-none text-primary">Esqueceu sua senha?</a>
                           </div>
                        </div>

                        <div class="row mb-12">
                           <div class="col">
                              <div class="form-check form-switch">
                                 <input class="form-check-input" type="checkbox" role="switch" id="loginRememberSwitch" formControlName="REMEMBER_ME">
                                 <label class="form-check-label" for="loginRememberSwitch">Lembre-se de mim</label>
                              </div>
                           </div>
                        </div>

                        <button type="submit" class="btn btn-primary log-btn w-100 rounded-3 d-flex items-center justify-center gap-6"
                           [disabled]="loading" (click)="login()">
                           @if (loading) { <div class="spinner-border" role="status"> <span class="visually-hidden">Entrando...</span> </div> }
                           @else { LOGIN  }
                        </button>
                     </form>
                  }
                  @case (2) {
                     <form [formGroup]="signinForm" class="w-100 mb-12" data-bs-theme="dark">
                        <div class="row mb-6">
                           <div class="col">
                              <label for="signinUsernameInput" class="form-label">Usuário</label>
                              <input type="text" id="signinUsernameInput" class="form-control rounded-3" formControlName="USERNAME"
                                 placeholder="Digite seu nome de usuário"
                                 [class.invalid]="USERNAME_SIGNIN.invalid && (USERNAME_SIGNIN.touched || USERNAME_SIGNIN.dirty)">
                           </div>
                        </div>

                        <div class="row mb-6">
                           <div class="col">
                              <label for="signinEmailInput" class="form-label">E-mail</label>
                              <input type="email" id="signinEmailInput" class="form-control rounded-3" formControlName="EMAIL"
                                 placeholder="Digite seu e-mail"
                                 [class.invalid]="EMAIL_SIGNIN.invalid && (EMAIL_SIGNIN.touched || EMAIL_SIGNIN.dirty)">
                           </div>
                        </div>

                        <div class="row mb-6">
                           <div class="col">
                              <label for="signinPasswordInput" class="form-label">Senha</label>
                              <input type="password" id="signinPasswordInput" class="form-control rounded-3" formControlName="SENHA"
                                 placeholder="Digite sua senha"
                                 [class.invalid]="SENHA_SIGNIN.invalid && (SENHA_SIGNIN.touched || SENHA_SIGNIN.dirty)">
                           </div>
                        </div>

                        <div class="row mb-6">
                           <div class="col">
                              <label for="signinConfirmPasswordInput" class="form-label">Confirmar senha</label>
                              <input type="password" id="signinConfirmPasswordInput" class="form-control rounded-3" formControlName="CONFIRM_SENHA"
                                 placeholder="Confirme sua senha"
                                 [class.invalid]="CONFIRM_SENHA_SIGNIN.invalid && (CONFIRM_SENHA_SIGNIN.touched || CONFIRM_SENHA_SIGNIN.dirty)">
                           </div>
                        </div>

                        <div class="row mb-12">
                           <div class="col">
                              <div class="form-check form-switch">
                                 <input class="form-check-input" type="checkbox" role="switch" id="signinRememberSwitch" formControlName="REMEMBER_ME" >
                                 <label class="form-check-label" for="signinRememberSwitch">Lembre-se de mim</label>
                              </div>
                           </div>
                        </div>
      
                        <button type="submit" class="btn btn-primary log-btn w-100 rounded-3 d-flex items-center justify-center gap-6"
                           [disabled]="loading" (click)="createUser()">
                           @if (loading) { <div class="spinner-border" role="status"> <span class="visually-hidden">Cadastrando...</span> </div> }
                           @else { CRIAR CONTA }
                        </button>
                     </form>

                     <!-- <span>Já tem uma conta? <a class="text-primary text-decoration-none fw-bold cursor-pointer" (click)="step = 1">Entre aqui</a></span> -->
                  }
                  @case (3) {

                  }
               }
            </div>
         </div>

         <div id="auth-footer" class="self-center w-100 text-center">
            @switch (step) {
               @case (1) {
                  <span>Não tem uma conta? <a class="text-primary text-decoration-none fw-bold cursor-pointer" (click)="step = 2">Junte-se a nós</a></span>
               }
               @case (2) {
                  <span>Já tem uma conta? <a class="text-primary text-decoration-none fw-bold cursor-pointer" (click)="step = 1">Entre por aqui</a></span>
               }
               @case (3) {

               }
            }
            <div id="other-logins" class="text-center">
               <p class="mb-0">ou</p>
               <div class="d-flex items-center justify-center gap-2">
                  <a type="button" class="btn btn-lg btn-outline-primary d-flex items-center justify-center rounded-circle"> <i class="bxl bx-google"></i> </a>
                  <a type="button" class="btn btn-lg btn-outline-primary d-flex items-center justify-center rounded-circle"> <i class="bxl bx-github"></i> </a>
                  <a type="button" class="btn btn-lg btn-outline-primary d-flex items-center justify-center rounded-circle"> <i class="bxl bx-microsoft"></i> </a>
               </div>
            </div>
         </div>
      </div>
   </div>
</div>

<!-- TEMPLATES -->
<p-toast position="top-center" key="tc" />
<!-- TEMPLATES -->
