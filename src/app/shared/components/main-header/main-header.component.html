<header>
   <div class="d-flex justify-between items-center container py-6">
      <h3>
         <a routerLink="/home" class="logo text-decoration-none fw-bold text-primary">Ready, Dice, Roll</a>
      </h3>

      <nav>
         <a type="button" class="btn btn-primary" routerLink="/auth" > Sign In </a>
      </nav>
   </div>
</header>

<div class="main-content">
  <p-drawer [(visible)]="visible" [closable]="false">
    <ng-template #header>
        <div class="flex items-center gap-2">
            <p-avatar image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png" shape="circle" />
            <span class="font-bold">Amy Elsner</span>
        </div>
    </ng-template>
    <p>
        Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo
        consequat.
    </p>
    <ng-template #footer>
        <div class="flex items-center gap-2">
            <button pButton label="Account" icon="pi pi-user" class="w-full" outlined></button>
            <button pButton label="Logout" icon="pi pi-sign-out" class="w-full" severity="danger" text></button>
        </div>
    </ng-template>
</p-drawer>

  <p-button (click)="visible = true" icon="pi pi-bars" />

  <router-outlet></router-outlet>
</div>
